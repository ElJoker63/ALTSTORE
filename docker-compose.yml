# Compose pensado para Coolify: sin mapeos de puerto al host.
# Coolify/Traefik enruta por dominio a los puertos internos (expose).
# Asigna los dominios en la UI de Coolify, servicio por servicio:
#   web      -> https://sidestore.udyat.site  (puerto interno 80)
#   anisette -> https://anisette.udyat.site   (puerto interno 6969)
services:
  # Servidor Python FastAPI: Sirve la landing, assets y altstore.json directamente del repositorio.
  web:
    build: .
    restart: unless-stopped
    expose:
      - "80"

  # Servidor de anisette v3 (Dadoum/anisette-v3-server).
  # Genera los datos anisette que SideStore necesita para firmar/refrescar.
  # Nunca recibe Apple IDs ni credenciales de usuarios.
  # Los usuarios lo configuran en SideStore -> Settings -> Anisette Servers.
  anisette:
    build:
      context: https://github.com/Dadoum/anisette-v3-server.git
    restart: unless-stopped
    expose:
      - "6969"
    volumes:
      - anisette-data:/opt/provision

volumes:
  anisette-data:
